<app-navbar></app-navbar>

<section class="repeatedPattern h-full sm:h-screen grid grid-cols-12 p-6">
  <div style="justify-self: center;"
    class="col-span-12 h-fit flex flex-col gap-y-6 p-6 bg-surface border border-surfaceBorder rounded">
    <!--  site name -->
    <h2 class="text-xs sm:text-sm text-surfaceText">
      <ng-template [ngIf]="isProfileSetBefore">
        بروزرسانی پروفایل کاربری
      </ng-template>
      <ng-template [ngIf]="!isProfileSetBefore">
        ثبت نام در سامانه
      </ng-template>
    </h2>
    <!-- upload picture -->
    <div class="flex flex-col items-center">
      <ngx-spinner [fullScreen]="false" name="uploadProfile" type="ball-scale-multiple"></ngx-spinner>
      <!-- logo -->
      <img [src]="avatar" class="rounded-full w-20" alt="rafiqaneh-logo" />
      <!--  choose file -->
      <div
        class="group flex items-center w-fit mt-4 rounded-sm border border-newPrimary bg-white hover:bg-newPrimary transition duration-200 ease-linear py-0.5 px-2 cursor-pointer">
        <label for="uploadProfilePic"
          class="text-sm font-sansbold w-fit text-newPrimary hover:text-white cursor-pointer">بارگذاری تصویر</label>
        <input #avatarElem (change)="avatarChanged($event)" id="uploadProfilePic" class="hidden" type="file" />
      </div>
    </div>
    <!-- ? form -->
    <form [formGroup]="registrationForm" class="flex flex-col gap-y-6">
      <!-- input fields -->
      <div class="grid grid-cols-12 gap-6">
        <!--  firstName -->
        <input id="firstName" type="text"
          class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary"
          placeholder="نام" formControlName="firstName" />
        <!--  lastName -->
        <input id="lastName" type="text"
          class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary"
          placeholder="نام خانوادگی" formControlName="lastName" />
        <!--  idCard -->
        <input id="idCard" type="tel"
          class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary"
          placeholder="کد ملی" formControlName="idCard" />
        <!--  province -->
        <select formControlName="province" (change)="provinceChanged()"
          class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary">
          <option [ngValue]="null">استان</option>
          <option *ngFor="let p of provinces" [ngValue]="p.code">
            {{ p.name }}
          </option>
        </select>
        <!--  city -->
        <select formControlName="city"
          class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary">
          <option [ngValue]="null">شهرستان</option>
          <option *ngFor="let c of cities" [ngValue]="c.code">
            {{ c.name }}
          </option>
        </select>
      </div>
      <!--  ticketNumber -->
      <div class="flex flex-col gap-y-3">
        <div class="grid grid-cols-12 gap-6">
          <input id="ticketNumber" type="tel"
            class="col-span-12 sm:col-span-6 p-2 text-xs sm:text-sm text-surfaceText border border-surfaceBorder rounded focus:bg-transparent focus:outline-newPrimary"
            placeholder="شماره بلیط :311xxxxx" formControlName="ticketNumber" />
        </div>
        <div class="flex items-center gap-x-1">
          <div class="hidden sm:block w-1 h-1 bg-faslenonewPrimary rounded-full"></div>
          <p class="text-faslenonewPrimary text-xs">
            اگر در برنامه های حضوری، بلیط قرعه کشی دریافت کرده اید، شماره بلیط خود را در فیلد بالا وارد کنید.
          </p>
        </div>
      </div>
      <!-- datepicker -->
      <div class="flex flex-col gap-y-1.5">
        <span class="text-xs text-surfaceText">تاریخ تولد:</span>
        <!-- <app-date-picker
          [placeholder]="'تاریخ تولد'"
          (changed)="birthDateChanged($event)"
          [date]="birthDate?.value"
        ></app-date-picker> -->
        <simple-date-picker [date]="birthDate?.value" (dateChanged)="birthDateChanged($event)"></simple-date-picker>
      </div>
      <!-- hint -->
      <!-- fatherName -->
      <!-- <input
    type="text"
    class="w-full p-2 text-xs sm:text-sm bg-gray-100 border border-mainGray rounded focus:bg-transparent focus:outline-newPrimary"
    placeholder="نام پدر"
    formControlName="fatherName"
  /> -->

      <!-- <input
    type="text"
    class="w-full p-2 text-xs sm:text-sm bg-gray-100 border border-mainGray rounded focus:bg-transparent focus:outline-newPrimary"
    placeholder="محل صدور شناسنامه"
    formControlName="issuancePlace"
  /> -->
      <!-- gender -->
      <!-- <div class="w-full">
    <span>جنسیت: </span>
    <mat-radio-group aria-label="جنسیت" formControlName="gender">
      <mat-radio-button class="px-2" value="female">خانم</mat-radio-button>
      <mat-radio-button class="px-2" value="male">آقا</mat-radio-button>
    </mat-radio-group>
  </div> -->
      <!-- birthYear -->
      <!-- <input
    id="birthDate"
    type="text"
    class="w-full p-2 text-xs sm:text-sm bg-gray-100 border border-mainGray rounded focus:bg-transparent focus:outline-newPrimary"
    placeholder="تاریخ تولد: به فرمت 1385/1/1"
    formControlName="birthDate"
  /> -->
      <!-- ? submitForm -->
      <button (click)="submit()"
        class="w-full md:w-3/4 mx-auto p-2 bg-newPrimary hover:bg-surface text-surface hover:text-newPrimary text-sm border hover:border-newPrimary rounded-sm">
        <ng-template [ngIf]="isProfileSetBefore"> بروزرسانی </ng-template>
        <ng-template [ngIf]="!isProfileSetBefore"> ثبت نام </ng-template>
      </button>
    </form>
  </div>
</section>
