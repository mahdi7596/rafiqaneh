<section class="vwhSection justify-center py-6 overflow-hidden">
    <!-- repeated stars -->
    <app-repeated-stars></app-repeated-stars>


    <div class="container grid grid-cols-12 mb-10">
        <div style="border: solid 1px #8946a687;background-color: rgba(137,70,166,0.2);"
            class="col-span-12 h-full bg-clip-padding backdrop-filter backdrop-blur-sm bg-opacity-10 rounded-md z-20">
            <!-- header -->
            <div style="border-bottom: solid 1px #8946a638;"
                class="w-full flex flex-wrap items-center justify-between px-6 md:px-12 py-4 bg-fardamoonPrimary bg-opacity-20 gap-y-3 sm:gap-y-0">
                <h2 class="flex-1 text-base lg:text-2xl text-surface">
                    نتیجه آزمون {{quizResultName}}
                </h2>

            </div>
            <div class="grid grid-cols-12 justify-center items-center gap-x-3 px-6 md:px-12 pb-8 my-6">
                <div class="col-span-12 flex flex-col gap-y-8 text-justify leading-loose">
                    <!-- <div dir="ltr" class="w-full grid grid-cols-4 gap-4">
                        <img *ngFor="let img of personalityTypeImage" [src]="img" class="rounded w-full" alt="">
                    </div> -->
                    <h2 style="border: solid 1px #8946a687;background-color: rgba(137,70,166,0.2);"
                        class="w-fit flex items-center flex-wrap gap-x-0.5 p-2 m-auto rounded text-surface text-xs gap-y-1.5">
                        تیپ شخصیتی شما:
                        <span class="text-surface font-sansbold text-sm sm:text-base md:text-lg lg:text-xl">
                            {{personalityType}}
                        </span>
                    </h2>

                    <div>
                        <app-radarchart *ngIf="mbtiPercentsReady" [mbtiPercentResult]="mbtiPercents"></app-radarchart>
                    </div>

                    <div class="flex flex-col gap-y-3">
                        <h3 class="text-base lg:text-xl text-surface">
                            {{jobGoodForYou}}
                        </h3>
                        <p class="text-sm sm:text-base lg:text-lg text-surface leading-loose">
                            {{personalityDescription}}
                        </p>
                    </div>

                    <div *ngIf="positiveThings"
                        class="w-full bg-green-200 border border-green-600 text-green-700 font-bold  rounded px-2 py-1">
                        {{positiveThings}}
                    </div>

                    <div *ngIf="negativeThings"
                        class="w-full bg-red-200 border border-red-600  text-red-700 font-bold rounded px-2 py-1">
                        {{negativeThings}}
                    </div>

                    <button (click)="goSolarsystem()"
                        style="border: solid 1px #8946a687;background-color: rgba(137,70,166);"
                        class="w-fit flex items-center flex-wrap gap-x-0.5 py-2 px-3 m-auto rounded text-surface text-xs gap-y-1.5">
                        بازگشت
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- planet-image -->
    <div class=" absolute bottom-0 transform translate-y-10">
        <img src="assets\fardamoon-event\mbti-component\s2-3.png" class="w-full" />
    </div>

</section>

<img (click)="goBack()" src="assets/fardamoon-event/back-route.png" class="absolute left-2 top-2 w-9 z-50" alt="">
