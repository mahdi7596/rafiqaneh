<app-custom-timeline [explanation]="explanation" [missions]="gardnerMissions"
planetImage="assets/fardamoon-event/garnerd-component/s3-3.png"
planetClass="absolute bottom-0 transform translate-y-14"
shazdeClass="absolute w-20 top-10 right-32 lg:left-96 xl:top-[600px] lg:top-96 lg:w-32"></app-custom-timeline>

<img (click)="goBack()" src="assets/fardamoon-event/back-route.png" class="absolute left-2 top-2 w-9" alt="">

<audio hidden class="hidden"  id="player" src="assets/new-voices/gardner.mp3" autoplay></audio>

<div class="">
    <button *ngIf="showAudio"  onclick="document.getElementById('player').pause()" (click)="onShow()">
        <img src="assets/fardamoon-event/audio.png" class="absolute right-2 top-2 w-9" alt="">
    </button> 
    <button *ngIf="!showAudio" onclick="document.getElementById('player').play()" (click)="onShow()" >
        <img src="assets/fardamoon-event/no-audio.png" class="absolute right-2 top-2 w-9" alt="">
    </button> 
</div>
