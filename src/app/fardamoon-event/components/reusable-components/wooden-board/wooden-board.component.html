<div class="relative">
  <img src="assets/fardamoon/images/wooden-board.png" class="w-5 sm:w-7" />
  <div [ngStyle]="{ border: 'solid 4px #77481F' }"
    class="h-fit w-44 sm:w-56 p-2 bg-[#f5f5f5] absolute top-0 -right-28 rounded">
    <!-- card text && next && previous qustions -->
    <div class="flex flex-col gap-y-2">
      <p class="text-sm sm:text-base text-justify leading-8">
        {{ questionTitle }}
      </p>
      <!-- next && previous qustions -->
      <div class="w-full flex justify-between">
        <!-- next -->
        <button [hidden]="lastQuestion" (click)="callNextClick()" class="preNextQuestions">سوال
          بعد</button>
        <!-- previous qustions -->
        <button [hidden]="firstQuestion" (click)="callPreClick()" class="preNextQuestions">سوال
          قبل</button>
      </div>
    </div>
  </div>
</div>
